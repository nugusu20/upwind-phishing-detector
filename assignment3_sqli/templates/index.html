<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL Injection Demo</title>
</head>
<body>
    <h1>SQL Injection Demo</h1>

    <p>This page demonstrates a vulnerable login flow and a secure login flow using parameterized queries.</p>

    <h2>Login Form</h2>

    <form method="POST">
        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>

        <label>Password:</label><br>
        <input type="text" name="password" required><br><br>

        <button type="submit" name="login_type" value="vulnerable">
            Test Vulnerable Login
        </button>

        <button type="submit" name="login_type" value="secure">
            Test Secure Login
        </button>
    </form>

    {% if result %}
        <hr>
        <h2>Result</h2>
        <p><strong>Login type:</strong> {{ login_type }}</p>
        <p><strong>Status:</strong> {{ result }}</p>

        <h3>Executed Query</h3>
        <pre>{{ executed_query }}</pre>
    {% endif %}
</body>
</html>
